name: obs-k8s-test

# Kubernetes test of the ragleap-observability SLO alerts and AlertManager wiring on a throwaway kind cluster.
# Manual (workflow_dispatch) or when a PR changes this file or the test folder. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/obs-k8s-test.yml
      - packages/ragleap-observability/tests/k8s/**

permissions:
  contents: read

jobs:
  obs-k8s-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool versions
        run: |
          kubectl version --client
          helm version --short
          kind version || echo "kind is not preinstalled; the test script downloads v0.24.0"
      - name: SLO alerts and AlertManager delivery on kind
        run: bash packages/ragleap-observability/tests/k8s/obs-k8s-test.sh
