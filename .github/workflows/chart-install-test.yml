name: chart-install-test

# Install, upgrade and uninstall test for the three RagLeap Helm charts on a throwaway kind cluster.
# Manual (workflow_dispatch) or when a PR changes this file or the test script. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/chart-install-test.yml
      - .github/scripts/chart-install-test.sh

permissions:
  contents: read

jobs:
  chart-install-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool versions
        run: |
          kubectl version --client
          helm version --short
          kind version || echo "kind is not preinstalled; the test script downloads v0.24.0"
      - name: Install, upgrade and uninstall the three charts on kind
        run: bash .github/scripts/chart-install-test.sh
