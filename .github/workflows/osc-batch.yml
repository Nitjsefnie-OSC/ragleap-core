# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - core-tests
# DELIBERATELY EXCLUDED (loud):
#   - compile-check: not in the keep list
#   - docker-build-and-smoke-test: not in the keep list
#   - ragleap-rag-tests: not in the keep list
#   - ragleap-tools-tests: not in the keep list
#   - ragleap-integrations-tests: not in the keep list
#   - ragleap-agents-tests: not in the keep list
#   - ragleap-security-tests: not in the keep list
#   - ragleap-memory-tests: not in the keep list
#   - ragleap-graph-tests: not in the keep list
#   - ragleap-voice-tests: not in the keep list
#   - ragleap-voice-wheel-smoke: not in the keep list
#   - ragleap-rag-java-tests: not in the keep list
#   - ragleap-graph-java-tests: not in the keep list
#   - ragleap-vectorstores-java-tests: not in the keep list
#   - ragleap-vectorstores-tests: not in the keep list
#   - helm-chart-lint: not in the keep list
#   - terraform-validate: not in the keep list
#   - slo-rules-test: not in the keep list
#   - wheel-contents: not in the keep list
#   - package-tests: not in the keep list

name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  core-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragleap
          POSTGRES_PASSWORD: ragleap
          POSTGRES_DB: ragleap_core
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.mutant }}
    - name: Mutant artifact id
      shell: bash
      run: |
        printf 'OSC_MUTANT_ID=%s\n' "$(printf '%s' "${{ matrix.mutant }}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install psql client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - name: Apply schema
      env:
        PGPASSWORD: ragleap
      run: psql -h localhost -U ragleap -d ragleap_core -f db/schema.sql
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run core test suite
      env:
        DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
      run: |
        python -m pytest tests/ -v
    - name: Docker file-grant tests
      env:
        DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
        RAGLEAP_DOCKER_TESTS: '1'
      run: |
        docker pull python:3.11-slim
        python -m pytest tests/test_sandbox_files_docker.py -v
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ strategy.job-index }}-${{ env.OSC_MUTANT_ID }}
        path: ${{ github.workspace }}/osc-mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
