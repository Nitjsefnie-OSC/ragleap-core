---
# Account that runs day-to-day administration. Must not be root.
ragleap_base_deploy_user: ragleap

# Public key for the deploy user. Leave empty to create the account without a key.
ragleap_base_deploy_ssh_public_key: ""

# The deploy user has no password, so sudo needs NOPASSWD to be usable.
ragleap_base_deploy_passwordless_sudo: true

ragleap_base_packages:
  - ca-certificates
  - curl
  - sudo
  - unattended-upgrades

# Opt-in sshd hardening. Off by default because a mistake can lock you out.
ragleap_base_harden_ssh: false

# prohibit-password allows root only with a key. 'no' needs a working deploy user with sudo.
ragleap_base_ssh_permit_root_login: prohibit-password

# Set false only inside a container, where there is no service manager to reload sshd.
ragleap_base_manage_services: true

# Opt-in firewall (ufw). Off by default because a mistake can lock you out.
ragleap_base_enable_firewall: false

# Extra TCP ports to open. The ports sshd really listens on are always opened first.
ragleap_base_firewall_allow_tcp: []
