[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragleap-security"
version = "0.1.0"
description = "Small, auditable security primitives for the ragleap libraries: immutable tenant scopes, a tamper-evident hash-chained audit log, secret handling and redaction, and hard input limits. Standard library only. Not independently audited."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "RagLeap" }
]
keywords = ["security", "audit-log", "multi-tenant", "secrets", "redaction", "llm", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/ragleap/ragleap-core"
Repository = "https://github.com/ragleap/ragleap-core"
Issues = "https://github.com/ragleap/ragleap-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ragleap_security"]
