# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - compile-check
#   - core-tests
#   - ragleap-rag-tests
#   - ragleap-tools-tests
#   - ragleap-integrations-tests
#   - ragleap-agents-tests
#   - ragleap-security-tests
#   - ragleap-memory-tests
#   - ragleap-graph-tests
#   - ragleap-voice-tests
#   - ragleap-voice-wheel-smoke
#   - ragleap-rag-java-tests
#   - ragleap-graph-java-tests
#   - ragleap-vectorstores-java-tests
#   - ragleap-vectorstores-tests
#   - helm-chart-lint
#   - terraform-validate
#   - slo-rules-test
#   - wheel-contents
#   - package-tests
# DELIBERATELY EXCLUDED (loud):
#   - docker-build-and-smoke-test: references repository secrets (secrets.GEMINI_API_KEY_CI)

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Compile check
      run: |
        python -m py_compile core/*.py
  core-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragleap
          POSTGRES_PASSWORD: ragleap
          POSTGRES_DB: ragleap_core
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install psql client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - name: Apply schema
      env:
        PGPASSWORD: ragleap
      run: psql -h localhost -U ragleap -d ragleap_core -f db/schema.sql
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run core test suite
      env:
        DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
      run: |
        python -m pytest tests/ -v
    - name: Docker file-grant tests
      env:
        DATABASE_URL: postgresql://ragleap:ragleap@localhost:5432/ragleap_core
        RAGLEAP_DOCKER_TESTS: '1'
      run: |
        docker pull python:3.11-slim
        python -m pytest tests/test_sandbox_files_docker.py -v
