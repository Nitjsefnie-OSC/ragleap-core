        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Build the wheel
      working-directory: packages/ragleap-voice
      run: |
        python -m pip install --upgrade pip
        pip install "build==1.2.2"
        python -m build --wheel
    - name: Check wheel contents (packaged manifest, no runtime dependencies)
      working-directory: packages/ragleap-voice
      run: |
        [ "$(ls dist/*.whl | wc -l)" = "1" ]
        WHEEL=$(ls dist/*.whl)
        python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/models.toml"
        python -m zipfile -l "$WHEEL" | grep -F "ragleap_voice/data/THIRD_PARTY_NOTICES.md"
        if unzip -p "$WHEEL" '*.dist-info/METADATA' | grep '^Requires-Dist:' | grep -v 'extra =='; then
          echo "wheel declares runtime dependencies"
          exit 1
        fi
    - name: Install the wheel in a clean environment and run the CLI
      run: |
        WHEEL=$(ls packages/ragleap-voice/dist/*.whl)
        python -m venv /tmp/smoke-venv
        /tmp/smoke-venv/bin/pip install "$WHEEL"
        EXTRA=$(/tmp/smoke-venv/bin/pip list --format=freeze | grep -v -E '^(pip|setuptools|wheel|ragleap-voice)==' || true)
        [ -z "$EXTRA" ] || { echo "unexpected packages installed: $EXTRA"; exit 1; }
        cd /tmp
        /tmp/smoke-venv/bin/ragleap-voice --version
        /tmp/smoke-venv/bin/ragleap-voice models check
        /tmp/smoke-venv/bin/ragleap-voice models list
        /tmp/smoke-venv/bin/python -m ragleap_voice models check
