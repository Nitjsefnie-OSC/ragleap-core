  ragleap-graph-tests:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/testpassword123
        ports:
        - 7687:7687
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install ragleap-graph with test deps
      working-directory: packages/ragleap-graph
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    - name: Wait for Neo4j to accept connections
      run: |
        for i in {1..30}; do
          if python3 -c "
        from neo4j import GraphDatabase
        d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','testpassword123'))
        d.verify_connectivity()
        d.close()
        " 2>/dev/null; then
            echo "Neo4j is ready"
            exit 0
          fi
          echo "Waiting for Neo4j... ($i/30)"
          sleep 2
        done
        echo "Neo4j failed to become ready in time"
        exit 1
    - name: Run ragleap-graph test suite
      working-directory: packages/ragleap-graph
      env:
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: testpassword123
      run: |
        python -m pytest tests/ -v
